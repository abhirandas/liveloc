<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Live Location</h1>
    <p class="subtitle">Real-time location sharing</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Sign In</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <!-- Login form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
      <div id="login-alert" class="alert hidden"></div>
    </form>

    <!-- Register form -->
    <form id="register-form" class="hidden">
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
      <div id="register-alert" class="alert hidden"></div>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
